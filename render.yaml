# Blueprint de Render para el backend.
# El frontend va en Vercel (ver DEPLOY.md).
#
# Los valores con `sync: false` se piden una sola vez al crear el Blueprint
# y NO quedan escritos en el repositorio.
services:
  - type: web
    name: canchas-api
    runtime: node
    plan: free
    region: oregon
    rootDir: Backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"

      # TiDB Cloud Starter (MySQL compatible). Completar host/usuario/clave
      # con los datos del cluster.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: canchas_db
      - key: DB_SSL
        value: "true"
      - key: DB_POOL_SIZE
        value: "5"

      # Render genera un secreto aleatorio para firmar los JWT.
      - key: JWT_SECRET
        generateValue: true

      # URL del frontend en Vercel (se puede actualizar después).
      - key: FRONTEND_URL
        sync: false

      # Reglas de negocio.
      - key: HORA_NOCTURNA_INICIO
        value: "20:00"
      - key: HORAS_CANCELACION_MINIMAS
        value: "24"
      - key: AUTH_RATE_LIMIT_MAX
        value: "20"
      - key: AUTH_RATE_LIMIT_WINDOW_MS
        value: "900000"

      # Render free corta requests largos y el disco es efímero.
      - key: MAX_VIDEO_MB
        value: "100"
