name: Keep Render awake

# Render free duerme el backend después de 15 minutos sin tráfico.
# Este workflow hace un GET al health check cada 5 minutos para despertarlo.
# Se usa 5 y no 10 para tener margen si GitHub demora la ejecución programada.
# No necesita ninguna cuenta extra: usa GitHub Actions del propio repo.
#
# El cron evita el minuto 0, que es cuando GitHub tiene más carga.
# La primera ejecución programada puede tardar en aparecer; si no corre,
# la alternativa documentada en DEPLOY.md es cron-job.org.

on:
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: curl -fsS --max-time 120 https://canchas-api-2m2q.onrender.com/api/health
