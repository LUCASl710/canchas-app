name: Deploy backend to Render

# Render puede redeployar solo, pero este repo está conectado como
# "Public Git Repository" (sin la GitHub App de Render), así que los push
# no siempre disparan el deploy. Este workflow llama al Deploy Hook.
#
# Configuración (una sola vez):
#   gh secret set RENDER_DEPLOY_HOOK_URL
#   (pegar la URL de Render → Settings → Deploy Hook)
#
# El hook está en Render → canchas-api → Settings → Deploy Hook.

on:
  push:
    branches: [main]
    paths:
      - 'Backend/**'
      - 'render.yaml'
      - '.github/workflows/render-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Falta el secret RENDER_DEPLOY_HOOK_URL en el repo." >&2
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
